[package]
name = "choco-native"
version = "0.1.0-dev.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Chocopie-Moments/runtime"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
choco-core = { path = "../choco-core" }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
