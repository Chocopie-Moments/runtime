plugins {
    id 'com.android.library' version '9.2.1'
    id 'org.jetbrains.kotlin.android' version '2.2.0'
}
// The standalone SDK has no React Native plugin, npm installation or React dependency.
android {
    namespace 'com.chocopie'
    compileSdk 37
    buildToolsVersion '37.0.0'
    defaultConfig { minSdk 24; targetSdk 36; consumerProguardFiles '../consumer-rules.pro' }
    sourceSets.main {
        java.srcDirs = ['../src/main/java']
        jniLibs.srcDirs = ['build/staged/jniLibs']
        assets.srcDirs = ['build/staged/assets']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
