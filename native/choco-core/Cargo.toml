[package]
name = "choco-core"
version = "0.1.0-dev.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Chocopie-Moments/runtime"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
