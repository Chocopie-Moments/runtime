apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react { libraryName = 'ChocoSpec'; codegenJavaPackageName = 'com.chocopie.reactnative' }
android {
    namespace 'com.chocopie.reactnative'
    compileSdkVersion rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig { minSdkVersion 24; targetSdkVersion 36; consumerProguardFiles 'consumer-rules.pro' }
    sourceSets.main {
        java.srcDirs = ['src/main/java']
        jniLibs.srcDirs = ['src/main/jniLibs']
    }
}
dependencies { implementation 'com.facebook.react:react-android' }
