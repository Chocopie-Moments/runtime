name: Publish reviewed runtime release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful build.yml run containing the reviewed artifacts
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
      - name: Require completed release gates and matching successful build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: node scripts/verify-release.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-${{ github.sha }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: reviewed
      - name: Publish exact reviewed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs reviewed/release

  acceptance:
    needs: publish
    runs-on: macos-26
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-${{ github.sha }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: reviewed
      - name: Resolve the actual approved tag and verify released binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-acceptance.mjs reviewed/release release-acceptance.json
      - name: Attach passed acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(node -p "JSON.parse(require('fs').readFileSync('release-acceptance.json')).swift.tag")"
          gh release upload "$TAG" release-acceptance.json
