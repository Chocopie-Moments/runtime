name: Runtime conformance and artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    uses: ./.github/workflows/android-proof.yml
  verify:
    needs: android
    env:
      CHOCO_BUILD_JOBS: '2'
      CARGO_BUILD_JOBS: '2'
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install pinned build tools
        shell: bash
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
          rustup toolchain install nightly-2026-10-07 --profile minimal --component rust-src
          python3 -m venv "$RUNNER_TEMP/choco-tools"
          "$RUNNER_TEMP/choco-tools/bin/pip" install meson==1.9.2 ninja==1.13.0
          echo "$RUNNER_TEMP/choco-tools/bin" >> "$GITHUB_PATH"
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.11
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.11
      - name: Build and exercise distributed engine
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash scripts/ci.sh
      - name: Retrieve Android artifacts from this exact workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-proof-${{ github.sha }}
          path: ${{ runner.temp }}/choco-android-artifacts
      - name: Verify Android source and artifact provenance
        run: |
          python3 scripts/restore-android-artifacts.test.py
          python3 scripts/restore-android-artifacts.py "$RUNNER_TEMP/choco-android-artifacts"
      - name: Stage iOS and React Native artifacts
        shell: bash
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          bash scripts/choco/build-renderer.sh ios-arm64
          bash scripts/choco/build-renderer.sh ios-simulator-arm64
          bash scripts/choco/build-ios-package.sh
          export CHOCO_IOS_PACKAGE="$(python3 -c 'import json; print(json.load(open("scripts/generated/choco-ios-package.json"))["package"])')"
          (
            cd "$CHOCO_IOS_PACKAGE"
            xcrun xcodebuild -list
            xcrun xcodebuild -scheme Choco -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/choco-swift" -configuration Release -jobs "$CHOCO_BUILD_JOBS" ARCHS=arm64 build
          )
          npm ci --prefix packages/react-native --ignore-scripts
          npm run typecheck --prefix packages/react-native
          node --test scripts/release-files.test.mjs scripts/swift-tag-plan.test.mjs scripts/prepare-publication-baseline.test.mjs scripts/publication-collisions.test.mjs scripts/release-acceptance.test.mjs
          CHOCO_RN_PLATFORMS=ios,android bash scripts/choco/build-rn-package.sh
          python3 scripts/stage-native.py
          node scripts/prepare-swift-tag.mjs release scripts/generated/swift-tag-plan.json
      - name: Attest release artifact provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ github.sha }}
          path: |
            release/
            scripts/generated/choco-web/build.json
            scripts/generated/choco-web/corpus-parity.json
            scripts/generated/swift-tag-plan.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Packed runtime in Chromium, Firefox and WebKit
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-${{ github.sha }}
          path: reviewed
      - name: Install pinned browser proof tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          cd tests/browser
          npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Exercise packed runtime with three engines serially
        run: node tests/browser/run.mjs reviewed/release scripts/generated/browser-proof.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-proof-${{ github.sha }}
          path: scripts/generated/browser-proof.json
          if-no-files-found: warn
          retention-days: 14
